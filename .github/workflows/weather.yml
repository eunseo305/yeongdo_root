# 영도 날씨(weather.json)를 1시간마다 새로 받아 커밋합니다.
# 필요한 Secret: KMA_AUTH_KEY (기상청 API허브 인증키)
# 처음 한 번은 Actions 탭 → "Update weather" → "Run workflow"로 직접 실행해 weather.json을 만들어 주세요.

name: Update weather

on:
  schedule:
    # 매시 50분(UTC 기준이지만 분 단위라 KST와 같음). 초단기실황이 매시 40분쯤 나오므로 그 뒤에 실행.
    # 배포 횟수를 줄이고 싶으면 단기예보 발표 직후인 3시간 간격으로 바꾸세요: "20 2,5,8,11,14,17,20,23 * * *"
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch KMA forecast
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
        run: node scripts/fetch-weather.mjs

      - name: Commit weather.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: update weather.json"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
