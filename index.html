<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영도 크루즈 동선 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column, step-by-step screens, sticky action bar at the bottom */
  --sea:#0d4a5c;
  --sea-deep:#08313d;
  --buoy:#e5533b;
  --sand:#f4f1ea;
  --paper:#ffffff;
  --ink:#1b2a30;
  --muted:#5f7178;
  --line:#dde3e2;
  --good:#2f8a5b;
  --warn:#c9822a;
  --display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Hiragino Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header.top{background:var(--sea);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.lang{display:flex;gap:4px}
.lang button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 7px;font-size:13px;cursor:pointer;font-family:var(--body);min-height:32px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--sea);border-color:#fff;font-weight:700}
main{flex:1;padding:20px 18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:28px;color:var(--sea-deep)}
h2{font-size:22px;color:var(--sea-deep)}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--buoy)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.options.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 12px;text-align:left;font-size:15px;font-family:var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:58px}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--sea);background:#e8f1f2;box-shadow:inset 0 0 0 1px var(--sea)}
.opt:focus-visible,.btn:focus-visible,.lang button:focus-visible,textarea:focus-visible,select:focus-visible,.link:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.bar-inner{width:100%;max-width:440px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(255,255,255,0));display:flex;gap:10px;pointer-events:auto}
.btn{flex:1;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;font-family:var(--body);cursor:pointer;background:var(--buoy);color:#fff;min-height:48px}
.btn.ghost{flex:0 0 auto;background:var(--paper);color:var(--sea);border:1.5px solid var(--line);padding:15px 18px}
.btn.sea{background:var(--sea)}
.btn:disabled{background:#c9d1d1;cursor:not-allowed}
.hero{background:var(--sea);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:27px}
.hero p{color:#cfe2e5;font-size:14.5px}
.hero .wave{position:absolute;right:-10px;bottom:-6px;opacity:.18}
.qr-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px;width:fit-content}
.aibox{border:1.5px solid var(--sea);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f3f8f9}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.5 var(--body);color:var(--ink);background:#fff;resize:vertical}
select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:16px var(--body);background:#fff;color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.steps-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.steps-list b{flex:none;width:26px;height:26px;border-radius:50%;background:#e8f1f2;color:var(--sea);display:grid;place-items:center;font-size:13px}
.ship{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--paper);cursor:pointer;text-align:left;font-family:var(--body);color:var(--ink)}
.ship[aria-pressed="true"]{border-color:var(--sea);background:#e8f1f2;box-shadow:inset 0 0 0 1px var(--sea)}
.ship .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ship strong{font-size:16px}
.times{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.pill{font-size:13px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap}
.pill.high{background:#fbe3dd;color:#b23a24}
.pill.mid{background:#fbefd9;color:#8a5a14}
.pill.low{background:#dff1e6;color:#21653f}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#e8f1f2;color:var(--sea);border-radius:999px;padding:4px 10px;font-size:13px}
.alert{border-radius:12px;padding:12px 14px;background:#fdece8;border-left:4px solid var(--buoy);font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.alert strong{color:#a7341f;font-variant-numeric:tabular-nums}
.ainote{border-radius:12px;padding:12px 14px;background:#e8f1f2;font-size:15px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:52px 18px 1fr;gap:0 10px}
.tl .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--sea-deep);padding-top:1px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--buoy);margin-top:6px;flex:none}
.tl .dot.end{background:var(--sea)}
.tl .line{flex:1;width:2px;background:var(--line);margin:4px 0}
.tl .body{padding-bottom:16px;display:flex;flex-direction:column;gap:3px}
.tl .body strong{font-size:16px}
.tl .body .d{font-size:13.5px;color:var(--muted)}
.leg{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.modes{display:flex;flex-wrap:wrap;gap:4px}
.mode{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode.on{background:#dff1e6;border-color:var(--good);color:#21653f;font-weight:700}
.tl .move{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.rt{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .st{color:var(--warn)}
.rt small{font-weight:400;color:var(--muted);font-size:13px}
.maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.maps a{font-size:13px;color:var(--sea);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.maps a:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.tag-out{font-size:12px;background:#fbefd9;color:#8a5a14;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sand);border-radius:10px;padding:10px 8px;text-align:center}
.stat .n{font-family:var(--display);font-size:24px;color:var(--sea-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sea)}
.reasons{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.demo{font-size:13px;color:var(--muted);text-align:center}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 0;font-size:18px;cursor:pointer;color:var(--warn);min-height:44px}
.stars button[aria-pressed="true"]{background:#fbefd9;border-color:var(--warn)}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#dcebee}
.mapbox svg{display:block;width:100%;height:auto}
#kmap{width:100%;height:320px;display:none}
.map-cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--paper);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.kpin{background:var(--buoy);color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font:700 13px var(--body);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.kpin.t{background:var(--sea)}
.ad-pin{cursor:pointer}
.ad-pin:focus{outline:none}
.ad-pin:focus-visible rect.bg{stroke:var(--sea);stroke-width:3}
.kad{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.kad .ic{position:relative;width:30px;height:30px;border-radius:8px;background:#e0442d;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center}
.kad .ic i{position:absolute;top:-7px;right:-9px;font:700 8.5px/1 var(--body);font-style:normal;background:#fff;color:#e0442d;border:1px solid #e0442d;border-radius:3px;padding:1px 2px}
.kad .nm{font:600 11.5px var(--body);color:#1b2a30;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;margin-top:2px;white-space:nowrap}
.adtoggle{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font:600 12px var(--body);color:#e0442d;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.adtoggle[aria-pressed="false"]{color:var(--muted)}
.adtoggle:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.adcard{border:1.5px solid #f3c6bd;background:#fff7f5;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.adcard .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.adcard .lbl{font:700 10.5px var(--body);color:#e0442d;border:1px solid #e0442d;border-radius:4px;padding:1px 5px;flex:none}
.adcard strong{font-size:16px}
.adcard .promo{color:#a7341f;font-weight:700;font-size:14px}
.adlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.adlist button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font:500 13px var(--body);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.adlist button[aria-pressed="true"]{border-color:#e0442d;color:#a7341f;background:#fff7f5}
.adlist button:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.adlist .dot{width:8px;height:8px;border-radius:2px;background:#e0442d}
.course-name{font-family:var(--display);font-size:24px;color:var(--sea-deep)}
.link{background:none;border:0;color:var(--sea);text-decoration:underline;font:14px var(--body);cursor:pointer;padding:8px 0;min-height:44px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
/* operator analysis */
.find{font-family:var(--display);font-size:26px;line-height:1.2;color:var(--sea-deep)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rows{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:14px}
.drow .nm{overflow-wrap:anywhere;line-height:1.25}
.track{position:relative;height:18px;background:var(--sand);border-radius:4px}
.track .pl{position:absolute;top:0;bottom:0;left:0;border-right:2px solid var(--sea-deep)}
.track .ac{position:absolute;top:5px;height:8px;left:0;border-radius:4px;background:var(--sea)}
.track .ac.up{background:var(--buoy)}
.drow .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.srow{display:grid;grid-template-columns:4.5em minmax(0,1fr) 5.4em;gap:8px;align-items:center;font-size:14px}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden}
.stack span{display:block;height:100%}
.hours{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;height:120px}
.hours div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:13px;color:var(--muted)}
.hours b{display:block;width:80%;background:var(--sea);border-radius:4px 4px 0 0}
.hours b.pk{background:var(--buoy)}
.rv{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px}
.rv .meta{font-size:13px;color:var(--muted)}
.todo{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:rise .28s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>
</head>

const COORD={T:[35.0756,129.0789],museum:[35.0785,129.0804],taejongdae:[35.0596,129.0832],gamji:[35.0553,129.0852],haenyeo:[35.0612,129.0640],

 daiso:[35.0905,129.0405],bridge:[35.0950,129.0355],oliveyoung:[35.0935,129.0375],lotte:[35.0975,129.0347]};
function km(a,b){const R=6371,r=Math.PI/180,[la1,lo1]=COORD[a],[la2,lo2]=COORD[b];const dl=(la2-la1)*r,dn=(lo2-lo1)*r;
  const h=Math.sin(dl/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))*1.35}
function leg(a,b){
  const {age,comp,weather}=state.a;
  const d=km(a,b),slow=age==="a70";
  const walk=Math.max(2,Math.round(d/(slow?3.2:4.2)*60));
  const taxi=Math.max(3,Math.round(d/22*60)+4);
  const bus=d<1.2?null:Math.round(d/15*60)+10;
  const lim=(slow||weather==="rain"||weather==="hot")?10:15;
  let mode,why;
  if(walk<=lim){mode="walk";why="near"}
  else if(weather==="rain"){mode="taxi";why="rain"}
  else if(slow||comp==="family"){mode="taxi";why="comfort"}
  else if(bus!==null&&bus-taxi<=10){mode="bus";why="cheap"}
  else{mode="taxi";why="fast"}
  return {d,walk,taxi,bus,mode,why,min:{walk,taxi,bus}[mode]};
}

/* ---------- recommendation engine (rule-based stand-in for the AI model) ---------- */
function score(p){
  const {age,comp,nat,interests,weather}=state.a;
  if((p.out||p.shop)&&!interests.includes("beauty"))return -1;
  if(p.shop)return 12;
  const m=p.tags.filter(g=>interests.includes(g)).length;
  let s=m?1+3*m:0.6;
  if(p.stairs&&age==="a70")s-=5;
  if(p.stairs&&age==="a50")s-=1.5;
  if(p.stairs&&comp==="family")s-=1;
  if(p.stairs&&comp==="group")s-=1;
  if(comp==="family"&&p.indoor)s+=2;
  if(comp==="couple"&&(p.tags.includes("cafe")||p.tags.includes("photo")))s+=1;
  if(comp==="friends"&&(p.tags.includes("food")||p.tags.includes("photo")))s+=1;
  if(nat==="ja"&&p.id==="haenyeo")s+=0.8;
  if((nat==="zh"||nat==="tw")&&(p.id==="bongnae"||p.id==="lotte"))s+=0.8;
  if(nat==="us"&&p.tags.includes("culture"))s+=0.5;
  if(weather==="rain"){s+=p.indoor?2.5:-2.5}
  if(weather==="hot"){if(p.indoor)s+=1.5;if(p.id==="trail")s-=1.5}
  if(weather==="cold"){if(p.id==="trail")s-=2;if(p.id==="taejongdae")s-=0.5;if(p.indoor)s+=0.8}
  // places people actually stay longer than planned and rate highly get a small boost (learning from reviews)
  s+=(RATING[p.id]-4.3)*0.8;
  return s;
}
function simulate(route,start){
  let tm=start,prev="T";const out=[];
  for(const p of route){const lg=leg(prev,p.id);tm+=lg.min;if(p.open&&tm<p.open)tm=p.open;out.push({p,at:tm,lg});tm+=p.dwell;prev=p.id}
  const backLeg=leg(prev,"T");
  return {stops:out,end:tm+backLeg.min,leave:tm,back:backLeg.min,backLeg};
}
function plan(){
  const c=CRUISES.find(x=>x.id===state.ship);
  const start=c.arr+15, allAboard=c.dep-30, limit=allAboard-15;
  const scored=PLACES.map(p=>({p,s:score(p)})).filter(x=>x.s>0);
  const beauty=state.a.interests.includes("beauty");
  let orders=[["E"],["W"],["E","W"],["W","E"]];
  if(beauty)orders=orders.concat([["E","O"],["W","O"],["E","W","O"]]);
  let best=null;
  for(const ord of orders){
    const pool=scored.filter(x=>ord.includes(x.p.zone)).sort((a,b)=>b.s-a.s);
    let chosen=[],meal=false;
    for(const x of pool){
      if(x.p.meal&&meal)continue;
      const trial=chosen.concat(x.p).sort((a,b)=>ord.indexOf(a.zone)-ord.indexOf(b.zone)||a.seq-b.seq);
      if(simulate(trial,start).end<=limit){chosen=trial;if(x.p.meal)meal=true}
    }
    if(!chosen.length)continue;
    const total=chosen.reduce((n,p)=>n+scored.find(y=>y.p===p).s,0)-(ord.length-1)*1.2;
    if(!best||total>best.total)best={ord,chosen,total};
  }
  if(!best){const m=PLACES[0];best={ord:["E"],chosen:[m],total:0}}
  const sim=simulate(best.chosen,start);
  return {c,start,allAboard,sim,ord:best.ord,chosen:best.chosen,dur:c.dep-c.arr};
}
function seeded(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}

function loadKakao(){
  if(!CONFIG.KAKAO_JS_KEY)return Promise.reject("no key");
  if(kakaoP)return kakaoP;
  kakaoP=new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src="https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey="+encodeURIComponent(CONFIG.KAKAO_JS_KEY);
    sc.onload=()=>{try{kakao.maps.load(res)}catch(e){rej(e)}};
    sc.onerror=rej;document.head.appendChild(sc);setTimeout(()=>rej("timeout"),6000);
  });

}

  if(r.ord.length>1&&!r.ord.includes("O"))reasons.push(x.r.oneWay);

  const prof=[x.nat[state.a.nat],x.age[state.a.age],x.comp[state.a.comp],state.a.weather?x.wx[state.a.weather]:null].filter(Boolean).map(v=>`<span class="chip">${esc(v)}</span>`).join("")+state.a.interests.map(k=>`<span class="chip">${esc(x.int[k])}</span>`).join("");
  let tl=`<li class="tl"><span class="t">${hm(r.start)}</span><span class="rail"><span class="dot end"></span><span class="line"></span></span><div class="body"><strong>${x.disembark}</strong><span class="d">${r.c.name}</span></div></li>`;
  r.sim.stops.forEach((st,i)=>{
    tl+=`<li class="tl"><span class="t">${hm(st.at)}</span><span class="rail"><span class="dot"></span><span class="line"></span></span><div class="body">
      ${legHTML(st.lg,x)}
      <strong>${i+1}. ${esc(st.p.name[L])}${st.p.out?`<span class="tag-out">${x.outside}</span>`:""}</strong>
      <span class="rt" aria-label="${x.rtAria} ${placeRating(st.p.id).avg}/5"><span class="st">★</span> ${placeRating(st.p.id).avg} <small>(${placeRating(st.p.id).n})</small></span>
      <span class="d">${esc(st.p.d[L])} · ${st.p.dwell}${x.min}</span>
      ${mapLinks(st.p,L)}</div></li>`;
  });
  tl+=`<li class="tl"><span class="t">${hm(r.sim.end)}</span><span class="rail"><span class="dot end"></span></span><div class="body">${legHTML(r.sim.backLeg,x)}<strong>${x.terminal}</strong></div></li>`;

  const fb=state.fbSent?`<p style="color:var(--good);font-size:14px">${x.fbThanks}</p>`:`
    <div class="stars">${[1,2,3,4,5].map(i=>`<button type="button" id="star-${i}" data-s="${i}" aria-pressed="${state.rating>=i}" aria-label="${i}/5">★</button>`).join("")}</div>
    <label class="f" for="fbLong">${x.fbLong}<select id="fbLong">${r.chosen.map(p=>`<option value="${p.id}">${esc(p.name[L])}</option>`).join("")}</select></label>
    <label class="f" for="fbText">${x.fbText}<textarea id="fbText" style="min-height:64px"></textarea></label>
    <button class="btn sea" id="fbSave" type="button" ${state.rating?"":"disabled"}>${x.fbSave}</button>`;

  s.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:8px">
    <p class="muted">${x.resultT} · ${r.c.name} · ${hm(r.c.arr)}–${hm(r.c.dep)}</p>
    <div class="course-name">${x.course[ordKey]}</div>
    <div class="chips">${prof}</div>
  </div>
  ${state.aiNote?`<div class="ainote"><b>${x.aiSays}</b><br>${esc(state.aiNote)}</div>`:""}
  ${state.aiMsg&&!state.aiNote?`<p class="muted">${esc(state.aiMsg)}</p>`:""}
  <div class="alert" role="note"><span>${x.leaveBy} <strong>${hm(r.sim.leave)}</strong> · ${x.returnBy} <strong>${hm(r.allAboard)}</strong></span><span class="muted">${x.alertP}</span></div>
  <section class="mapbox" aria-label="map">
    <div id="kmap"></div>
    <div id="smap">${sketchMap(r)}</div>
    <div class="map-cap"><span id="mapCap">${MAPT[L].sketch}</span><button type="button" class="adtoggle" id="adToggle" aria-pressed="${state.adsOn}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5" fill="currentColor"/></svg>${ADT[L].toggle}</button></div>
  </section>
  <div id="adPanel">${adPanelHTML(r)}</div>
  <ol class="timeline">${tl}</ol>
  <p class="muted" style="margin-top:-8px">${x.rtSrc} ${x.modeNote}</p>
  <section class="card">
    <h2 style="font-size:19px">${x.statsT}</h2>
    <div class="stats">
      <div class="stat"><div class="n">${n}</div><div class="l">${x.sN}</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">${x.sPct}</div></div>
      <div class="stat"><div class="n">${rate}</div><div class="l">${x.sRate} / 5</div></div>
    </div>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
  </section>
  <section class="card">
    <h2 style="font-size:19px">${x.whyT}</h2>
    <ul class="reasons">${reasons.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>
  </section>
  <section class="card" id="fb">
    <h2 style="font-size:19px">${x.fbT}</h2>
    <p class="muted">${x.fbP}</p>
    ${fb}
  </section>
  <p class="demo">${x.demo}</p>`;
  kmapObj=null;kakaoMap(r);wireAds(r);
  s.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    state.rating=+b.dataset.s;
    s.querySelectorAll("[data-s]").forEach(o=>o.setAttribute("aria-pressed",String(+o.dataset.s<=state.rating)));
    const sv=document.getElementById("fbSave");if(sv)sv.disabled=false;
  });
  const sv=document.getElementById("fbSave");
  if(sv)sv.onclick=()=>{
    saveReview({stars:state.rating,place:document.getElementById("fbLong").value,nat:state.a.nat,text:document.getElementById("fbText").value.trim().slice(0,200),mine:true});
    state.fbSent=true;renderResult(s,a);document.getElementById("fb").scrollIntoView({block:"center"});
  };
  a.innerHTML=`<button class="btn ghost" id="backBtn" type="button">${x.back}</button><button class="btn" id="againBtn" type="button">${x.again}</button>`;
  document.getElementById("backBtn").onclick=()=>{state.screen="q";state.q=QUESTIONS.length-1;render()};
  document.getElementById("againBtn").onclick=()=>{state={...state,screen:"home",q:0,a:blankA(),ship:null,rating:0,aiText:"",aiNote:"",aiMsg:"",fbSent:false};render()};
}

/* ---------- operator view (Korean only): stay time, reviews, spending patterns ---------- */
function renderOps(s,a){
  const nm=id=>PLACES.find(p=>p.id===id).name.ko.replace(/ \(.*\)/,"");
  const rows=PLACES.map(p=>({id:p.id,plan:p.dwell,act:DWELL[p.id],diff:DWELL[p.id]-p.dwell})).sort((x,y)=>y.diff-x.diff);
  const top=rows[0],low=rows[rows.length-1];
  const maxM=Math.max(...rows.map(r=>Math.max(r.plan,r.act)));
  const avgDiff=Math.round(rows.reduce((n,r)=>n+r.diff,0)/rows.length);
  const mine=loadReviews();
  const allRev=mine.concat(SAMPLE_REVIEWS);
  const avgStars=(allRev.reduce((n,r)=>n+r.stars,0)/allRev.length).toFixed(1);
  const peak=HOURS.reduce((p,h)=>h[1]>p[1]?h:p);
  const maxH=peak[1];
  const natName={ja:"일본",zh:"중국",us:"미국",kr:"한국",tw:"대만",other:"기타"};
  const col={food:"#0d4a5c",cafe:"#7fb3bf",shop:"#e5533b"};
  const topSpend=SPEND.reduce((p,c)=>c.avg>p.avg?c:p);
  s.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:8px">
    <p class="muted">운영자용 · 체류·후기·소비 분석</p>
    <div class="find">${nm(top.id)}에서 계획보다 ${top.diff}분 더 머물러요</div>
    <p class="muted">추천 동선의 예상 시간과 실제 머문 시간을 비교하면, 사람들이 오래 머무는 곳에 상권을 키울 수 있어요.</p>
  </div>
  <div class="kpis">
    <div class="stat"><div class="n">${avgDiff>0?"+":""}${avgDiff}분</div><div class="l">평균 체류 차이</div></div>
    <div class="stat"><div class="n">${avgStars}</div><div class="l">평균 후기 별점</div></div>
    <div class="stat"><div class="n">${peak[0]}시</div><div class="l">방문 가장 많은 시간</div></div>
  </div>
  <section class="card">
    <h2 style="font-size:19px">장소별 체류시간: 계획 vs 실제</h2>
    <div class="legend"><span><i style="background:var(--buoy)"></i>계획보다 김</span><span><i style="background:var(--sea)"></i>계획보다 짧음</span><span><i style="border:2px solid var(--sea-deep);background:none"></i>계획 시간</span></div>
    <div class="rows">${rows.map(r=>`<div class="drow"><span class="nm">${esc(nm(r.id))}</span><span class="track"><span class="pl" style="width:${r.plan/maxM*100}%"></span><span class="ac ${r.diff>0?"up":""}" style="width:${r.act/maxM*100}%"></span></span><span class="v">${r.diff>0?"+":""}${r.diff}분</span></div>`).join("")}</div>
    <p class="muted">${nm(low.id)}은(는) 계획보다 ${-low.diff}분 짧아요. 볼거리 안내를 보강하거나 동선 시간을 줄여도 돼요.</p>
  </section>
  <section class="card">
    <h2 style="font-size:19px">국적별 1인 평균 지출과 쓰는 곳</h2>
    <div class="legend"><span><i style="background:${col.food}"></i>음식</span><span><i style="background:${col.cafe}"></i>카페</span><span><i style="background:${col.shop}"></i>쇼핑</span></div>
    <div class="rows">${SPEND.map(d=>`<div class="srow"><span>${natName[d.k]}</span><span class="stack" aria-label="음식 ${d.food}%, 카페 ${d.cafe}%, 쇼핑 ${d.shop}%"><span style="width:${d.food}%;background:${col.food}"></span><span style="width:${d.cafe}%;background:${col.cafe}"></span><span style="width:${d.shop}%;background:${col.shop}"></span></span><span class="v" style="text-align:right;font-weight:700;white-space:nowrap">${won(d.avg)}</span></div>`).join("")}</div>
    <p class="muted">${natName[topSpend.k]} 승객이 가장 많이 쓰고, 그중 쇼핑 비중이 ${topSpend.shop}%예요.</p>
  </section>
  <section class="card">
    <h2 style="font-size:19px">시간대별 영도 방문 인원</h2>
    <div class="hours">${HOURS.map(h=>`<div><b class="${h===peak?"pk":""}" style="height:${h[1]/maxH*85}%"></b>${h[0]}</div>`).join("")}</div>
    <p class="muted">${peak[0]}시 전후로 몰려요. 식당은 이 시간 전에 준비를 끝내면 좋아요.</p>
  </section>
  <section class="card">
    <h2 style="font-size:19px">최근 후기</h2>
    ${allRev.slice(0,6).map(r=>`<div class="rv"><div class="meta">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)} · ${esc(nm(r.place))} · ${natName[r.nat]||"기타"}${r.mine?" · 이 기기에서 작성":""}</div>${r.text?esc(r.text):'<span class="muted">별점만 남김</span>'}</div>`).join("")}
  </section>
  <section class="card">
    <h2 style="font-size:19px">그래서 이렇게 해볼 수 있어요</h2>
    <ul class="todo">
      <li>${nm(top.id)}처럼 오래 머무는 곳 주변 가게에 입항일 정보를 먼저 알려요.</li>
      <li>${peak[0]}시 점심 피크 전에 해산물 식당 대기 안내를 앱에 띄워요.</li>
      <li>${natName[topSpend.k]} 승객이 많은 날은 쇼핑 동선(다이소·올리브영·롯데백화점 광복점)을 더 앞에 둬요.</li>
    </ul>
  </section>
  <p class="demo">위 숫자와 예시 후기는 시연용 가상 데이터예요. 실제로는 QR 접속 기록, 후기·체류시간 입력, 카드 결제 통계로 채워요. 이 기기에서 남긴 후기는 맨 위에 함께 보여요.</p>`;
  a.innerHTML=`<button class="btn ghost" id="backBtn" type="button">이전</button><button class="btn" id="homeBtn" type="button">관광객 화면으로</button>`;
  document.getElementById("backBtn").onclick=()=>{state.screen="home";render()};
  document.getElementById("homeBtn").onclick=()=>{state.screen="home";render()};
}

render();
}
</script>
</body>
</html>
